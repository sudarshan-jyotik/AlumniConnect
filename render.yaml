services:
  - type: web
    name: alumniconnect-api
    runtime: python
    rootDir: Alumni_Project_Final
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: alumniconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:3000"

databases:
  - name: alumniconnect-db
    databaseName: alumniconnect
    user: postgres
    plan: free
